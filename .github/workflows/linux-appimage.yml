name: linux-appimage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install and extract pinned mpv packages
        run: |
          mkdir -p build/mpv-debs
          cd build
          base=https://archive.ubuntu.com/ubuntu/pool/universe/m/mpv
          lib=libmpv2_0.37.0-1ubuntu4_amd64.deb
          cli=mpv_0.37.0-1ubuntu4_amd64.deb
          curl -fsSL "$base/$lib" -o "$lib"
          curl -fsSL "$base/$cli" -o "$cli"
          printf '%s  %s\n' \
            12ea9d67e291a90cea5b7497f3f9d196643bf2e85ad17cb683e9c7ad18981c00 "$lib" \
            26b9273c3cc4c69b55ad908d168c624b95fd6785ea96625143e344b53e786e94 "$cli" | sha256sum -c
          # Apt supplies the signed Noble dependency closure; stage the media entry points from these exact payloads.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./$lib" "./$cli"
          dpkg-deb -x "$lib" mpv-debs
          dpkg-deb -x "$cli" mpv-debs

      - name: Install build and X11 test tools
        run: |
          sudo apt-get install -y --no-install-recommends \
            patchelf binutils squashfs-tools desktop-file-utils xvfb xauth xdotool x11-utils fonts-dejavu-core \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1 \
            libegl1 libopengl0 libgl1-mesa-dri

      - name: Install pinned wheels and project metadata
        run: |
          python -m pip install --no-deps 'https://files.pythonhosted.org/packages/4b/a1/de02c0913726728eca56ee258875cbba9c7b0572c63f494fd9f55c7852e3/uv-0.13.4-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=05e4332791b4d55b6dde8695b7fa6079b26991519f44760887c5dfbd5ca4fe53'
          uv venv --python "$(command -v python)"
          source .venv/bin/activate
          uv pip install --require-hashes --only-binary :all: -r packaging/requirements-appimage.txt
          uv pip install --no-deps --no-build-isolation .

      - name: Build onedir bundle
        run: .venv/bin/pyinstaller --noconfirm booru-viewer.spec

      - name: Stage AppDir
        run: .venv/bin/python packaging/stage.py

      - name: Fetch type2 runtime
        run: |
          # The upstream continuous URL is mutable; fail if the validated runtime changes.
          curl -fsSL https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o build/runtime-x86_64
          printf '%s  build/runtime-x86_64\n' 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46 | sha256sum -c

      - name: Build AppImage
        run: |
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o build/appimagetool
          printf '%s  build/appimagetool\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 | sha256sum -c
          chmod +x build/appimagetool
          version=$(.venv/bin/python -c 'from importlib.metadata import version; print(version("booru-viewer"))')
          appimage="dist/booru-viewer-$version-x86_64.AppImage"
          ARCH=x86_64 build/appimagetool --appimage-extract-and-run -n --runtime-file build/runtime-x86_64 \
            --mksquashfs-opt -processors --mksquashfs-opt 4 build/AppDir "$appimage"
          printf 'APPIMAGE=%s\nBOORU_VERSION=%s\n' "$appimage" "$version" >> "$GITHUB_ENV"

      - name: Verify version and X11 window identity
        run: |
          # Keep the host graphics stack, but do not let the smoke test find a system mpv.
          sudo apt-get purge -y mpv libmpv2
          for elf in build/AppDir/usr/{bin/mpv,lib/booru-viewer/_internal/mpv-lib/libmpv.so.2}; do
            linkage=$(ldd -r "$elf" 2>&1) || { printf '%s\n' "$linkage" >&2; exit 1; }
            if [[ "$linkage" == *'not found'* || "$linkage" == *'undefined symbol'* ]]; then
              printf '%s\n' "$linkage" >&2
              exit 1
            fi
          done
          actual=$("$APPIMAGE" --appimage-extract-and-run --version)
          printf '%s\n' "$actual"
          test "$actual" = "booru-viewer $BOORU_VERSION"

          unset WAYLAND_DISPLAY
          QT_QPA_PLATFORM=xcb xvfb-run -a bash -euo pipefail -c '
            "$APPIMAGE" --appimage-extract-and-run &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            win=$(timeout 60s xdotool search --onlyvisible --sync --name "^booru-viewer$")
            class=$(xprop -id "$win" WM_CLASS)
            printf "%s\n" "$class"
            [[ "$class" == *"\"booru-viewer\", \"booru-viewer\""* ]]
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: booru-viewer-appimage
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error
