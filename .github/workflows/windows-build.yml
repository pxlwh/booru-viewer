name: windows-build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]>=0.27,<1.0" "Pillow>=10.0,<12.0" "PySide6>=6.6,<7.0" "python-mpv>=1.0,<2.0" pyinstaller

      - name: Fetch libmpv
        shell: pwsh
        # libmpv-2.dll is ~99 MB and gitignored (*.dll), so it is not in the
        # checkout — the spec bundles it into the installer at build time.
        # LGPL variant on purpose: booru-viewer only decodes, never encodes,
        # so the GPL x264/x265 encoders in the default build are dead weight
        # this MIT-licensed app should not be shipping. Pinned + checksummed;
        # bump both together when refreshing.
        run: |
          $url = 'https://github.com/zhongfly/mpv-winbuild/releases/download/2026-08-28-e8673660ab/mpv-dev-lgpl-x86_64-20260828-git-e8673660ab.7z'
          $want = '470437b5dc9f8c74092fdfab668e89bedf7b1a6385a53ffadf241a6a7a4c6ffb'
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          $got = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "libmpv checksum mismatch: got $got, want $want" }
          7z x -y mpv-dev.7z libmpv-2.dll
          if (-not (Test-Path libmpv-2.dll)) { throw "libmpv-2.dll missing after extract" }
          Write-Host "libmpv-2.dll: $((Get-Item libmpv-2.dll).Length) bytes"

      - name: Build onedir bundle
        run: pyinstaller --noconfirm booru-viewer.spec

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) { $path = $iscc.Source }
          else {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
            )
            $path = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $path) {
            # The runner image ships Inno Setup but does not guarantee PATH,
            # and windows-2025 only picked it up recently. Install as fallback.
            choco install innosetup --no-progress -y
            $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC: $path"
          "ISCC=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: booru-viewer-setup
          path: dist/booru-viewer-setup.exe
          if-no-files-found: error
