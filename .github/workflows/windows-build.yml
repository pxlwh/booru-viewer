name: windows-build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]>=0.27,<1.0" "Pillow>=10.0,<12.0" "PySide6>=6.6,<7.0" "python-mpv>=1.0,<2.0" pyinstaller

      - name: Build onedir bundle
        run: pyinstaller --noconfirm booru-viewer.spec

      - name: Build installer
        # ISCC is preinstalled on the windows-latest image (Inno Setup 6.x)
        run: iscc installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: booru-viewer-setup
          path: dist/booru-viewer-setup.exe
          if-no-files-found: error
